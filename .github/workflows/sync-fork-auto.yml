name: 自动同步Fork

on:
  workflow_dispatch:   # 手动触发，推荐
   schedule:
     - cron: '0 8 * * *'  # 可选：每天 UTC 08:00 自动同步

jobs:
  sync:

    runs-on: ubuntu-latest

    steps:
      - uses: zxmqqzz/fork-sync@v2.0
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          owner: webLiang
          base: master
          head: master
